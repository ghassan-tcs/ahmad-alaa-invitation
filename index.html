<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة عقد قران — أحمد وآلاء</title>
<meta name="description" content="يسرّنا دعوتكم لحضور حفل عقد قراننا">
<meta name="theme-color" content="#FDEEEA">

<meta property="og:type" content="website">
<meta property="og:title" content="دعوة عقد قران — أحمد وآلاء">
<meta property="og:description" content="يسرّنا دعوتكم لمشاركتنا فرحتنا">
<meta property="og:locale" content="ar_AR">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
</div>

<div class="petals" id="petals" aria-hidden="true"></div>

<main class="card" id="card">

  <!-- إطار ذهبي مرسوم -->
  <svg class="frame" viewBox="0 0 400 700" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <rect x="10" y="10" width="380" height="680" rx="4" fill="none" stroke="currentColor" stroke-width="1.1"/>
    <rect x="17" y="17" width="366" height="666" rx="3" fill="none" stroke="currentColor" stroke-width=".5" opacity=".55"/>
  </svg>

  <svg class="corner tl" viewBox="0 0 60 60" aria-hidden="true" focusable="false">
    <path d="M5 52 C5 30 18 12 46 7" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M13 34 C9 28 10 22 15 19 C18 25 17 31 13 34 Z" fill="currentColor" opacity=".34"/>
    <path d="M21 23 C19 16 22 11 28 10 C29 17 26 22 21 23 Z" fill="currentColor" opacity=".26"/>
    <path d="M22 27 C28 25 34 27 36 32 C30 34 24 32 22 27 Z" fill="currentColor" opacity=".2"/>
    <circle cx="46" cy="7" r="2.6" fill="currentColor" opacity=".55"/>
    <circle cx="7" cy="47" r="1.7" fill="currentColor" opacity=".45"/>
  </svg>
  <svg class="corner tr" viewBox="0 0 60 60" aria-hidden="true" focusable="false">
    <path d="M5 52 C5 30 18 12 46 7" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M13 34 C9 28 10 22 15 19 C18 25 17 31 13 34 Z" fill="currentColor" opacity=".34"/>
    <path d="M21 23 C19 16 22 11 28 10 C29 17 26 22 21 23 Z" fill="currentColor" opacity=".26"/>
    <path d="M22 27 C28 25 34 27 36 32 C30 34 24 32 22 27 Z" fill="currentColor" opacity=".2"/>
    <circle cx="46" cy="7" r="2.6" fill="currentColor" opacity=".55"/>
    <circle cx="7" cy="47" r="1.7" fill="currentColor" opacity=".45"/>
  </svg>
  <svg class="corner bl" viewBox="0 0 60 60" aria-hidden="true" focusable="false">
    <path d="M5 52 C5 30 18 12 46 7" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M13 34 C9 28 10 22 15 19 C18 25 17 31 13 34 Z" fill="currentColor" opacity=".34"/>
    <path d="M21 23 C19 16 22 11 28 10 C29 17 26 22 21 23 Z" fill="currentColor" opacity=".26"/>
    <path d="M22 27 C28 25 34 27 36 32 C30 34 24 32 22 27 Z" fill="currentColor" opacity=".2"/>
    <circle cx="46" cy="7" r="2.6" fill="currentColor" opacity=".55"/>
    <circle cx="7" cy="47" r="1.7" fill="currentColor" opacity=".45"/>
  </svg>
  <svg class="corner br" viewBox="0 0 60 60" aria-hidden="true" focusable="false">
    <path d="M5 52 C5 30 18 12 46 7" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M13 34 C9 28 10 22 15 19 C18 25 17 31 13 34 Z" fill="currentColor" opacity=".34"/>
    <path d="M21 23 C19 16 22 11 28 10 C29 17 26 22 21 23 Z" fill="currentColor" opacity=".26"/>
    <path d="M22 27 C28 25 34 27 36 32 C30 34 24 32 22 27 Z" fill="currentColor" opacity=".2"/>
    <circle cx="46" cy="7" r="2.6" fill="currentColor" opacity=".55"/>
    <circle cx="7" cy="47" r="1.7" fill="currentColor" opacity=".45"/>
  </svg>

  <div class="inner">

    <div class="seal reveal" style="--d:0ms" aria-hidden="true">
      <svg viewBox="0 0 66 66" focusable="false">
        <circle cx="33" cy="33" r="30" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="33" cy="33" r="26" fill="none" stroke="currentColor" stroke-width=".5" opacity=".55"/>
      </svg>
      <span class="seal-letters"><i id="initialGroom"></i><span class="seal-dot"></span><i id="initialBride"></i></span>
    </div>

    <p class="bismillah reveal" style="--d:120ms">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>

    <blockquote class="verse reveal" style="--d:210ms">
      <p id="verse">&nbsp;</p>
      <cite id="verseSource"></cite>
    </blockquote>

    <div class="rule reveal" style="--d:300ms" aria-hidden="true">
      <svg viewBox="0 0 220 18" focusable="false">
        <line x1="0" y1="9" x2="82" y2="9" stroke="currentColor" stroke-width=".8"/>
        <line x1="138" y1="9" x2="220" y2="9" stroke="currentColor" stroke-width=".8"/>
        <path d="M110 2 L118 9 L110 16 L102 9 Z" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="110" cy="9" r="1.6" fill="currentColor"/>
        <circle cx="92" cy="9" r="1.4" fill="currentColor"/>
        <circle cx="128" cy="9" r="1.4" fill="currentColor"/>
      </svg>
    </div>

    <!-- اسم الضيف -->
    <section class="guest reveal" style="--d:400ms" aria-live="polite">
      <p class="guest-label">دعوة خاصة إلى</p>
      <p class="guest-name" id="guestName">&nbsp;</p>
    </section>

    <p class="intro reveal" style="--d:490ms">يسرّنا وتُسعدنا دعوتكم لحضور حفل</p>
    <p class="occasion reveal" style="--d:560ms" id="occasion">&nbsp;</p>

    <!-- الاسمان -->
    <section class="couple reveal" style="--d:650ms">
      <p class="name" id="groom">&nbsp;</p>
      <div class="amp" aria-hidden="true">
        <svg viewBox="0 0 90 40" focusable="false">
          <line x1="0" y1="20" x2="28" y2="20" stroke="currentColor" stroke-width=".8"/>
          <line x1="62" y1="20" x2="90" y2="20" stroke="currentColor" stroke-width=".8"/>
          <path d="M45 9 C51 9 55 13 55 18 C55 25 45 28 45 33 C45 28 35 25 35 18 C35 13 39 9 45 9 Z"
                fill="none" stroke="currentColor" stroke-width="1.1"/>
        </svg>
      </div>
      <p class="name" id="bride">&nbsp;</p>
    </section>

    <!-- التفاصيل -->
    <section class="details reveal" style="--d:760ms">
      <div class="detail">
        <span class="detail-key">التاريخ</span>
        <span class="detail-val" id="dateText">&nbsp;</span>
        <span class="detail-sub" id="timeText"></span>
      </div>
      <div class="detail">
        <span class="detail-key">المكان</span>
        <span class="detail-val" id="venue">&nbsp;</span>
        <span class="detail-sub" id="address"></span>
      </div>
    </section>

    <!-- العدّاد -->
    <section class="countdown reveal" style="--d:860ms" id="countdown" hidden>
      <div class="unit"><b id="cdD">0</b><span>يوم</span></div>
      <div class="unit"><b id="cdH">0</b><span>ساعة</span></div>
      <div class="unit"><b id="cdM">0</b><span>دقيقة</span></div>
      <div class="unit"><b id="cdS">0</b><span>ثانية</span></div>
    </section>
    <p class="arrived" id="arrived" hidden>حلّ اليوم الموعود — بانتظاركم 🤍</p>

    <div class="actions reveal" style="--d:950ms">
      <a class="btn" id="mapBtn" href="#" target="_blank" rel="noopener">الموقع على الخريطة</a>
      <button class="btn ghost" id="icsBtn" type="button">أضِف إلى التقويم</button>
    </div>

    <p class="closing reveal" style="--d:1040ms" id="closing">&nbsp;</p>

  </div>
</main>

<p class="hint" id="hint" hidden></p>

<script src="assets/js/app.js"></script>
</body>
</html>
